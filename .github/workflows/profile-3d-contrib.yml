name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # once a day at 18:00 UTC, which is midnight in Dhaka
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Palette for the calendar. Remove this line to get the stock designs instead.
          SETTING_JSON: .github/profile-3d-contrib.json
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --staged --quiet || git commit -m "chore: refresh 3d contribution graph"
          git push
